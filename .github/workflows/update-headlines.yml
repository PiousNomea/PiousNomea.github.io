name: Update Dimsum Daily Headlines

on:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours (UTC), at :17 to avoid the busy top of the hour
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push: # also run when the scraper or this workflow changes
    branches: [main]
    paths:
      - scrape_headlines.py
      - .github/workflows/update-headlines.yml

permissions:
  contents: write # lets the job commit headlines.json

concurrency:
  group: update-headlines
  cancel-in-progress: false

jobs:
  update-headlines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape_headlines.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add headlines.json
          if git diff --cached --quiet; then
            echo "No new headlines"
          else
            git commit -m "Update headlines"
            git pull --rebase origin main
            git push
          fi
