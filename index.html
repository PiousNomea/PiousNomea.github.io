<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Insiders Guide to Hong Kong</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400&display=swap" rel="stylesheet">
  <style>
  /* General Styles */
  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    position: relative;
    color: white; /* Ensures text readability over animated background */
  }

  /* Canvas for screensaver background */
  #backgroundCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* Places canvas behind content */
  }

  /* Main Heading Styles */
  .MainHeader {
    color: red;
    text-align: center;
    font-family: 'Press Start 2P', cursive;
    font-size: 2.5em;
    text-shadow: 0 0 10px rgba(255, 0, 0, 0.8), 0 0 20px rgba(255, 0, 0, 0.6);
    animation: neonGlow 2s infinite alternate, pulse 1.5s infinite ease-in-out;
  }

  /* Subheading Styles */
  h3.MainHeader {
    font-family: Arial, sans-serif;
    font-size: 1.2em;
    color: #ff4040;
    text-shadow: 0 0 5px rgba(255, 64, 64, 0.7);
    animation: none;
  }

  /* Animations */
  @keyframes neonGlow {
    0% { text-shadow: 0 0 10px rgba(255, 0, 0, 0.8), 0 0 20px rgba(255, 0, 0, 0.6), 0 0 30px rgba(255, 0, 0, 0.4); }
    50% { text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(0, 255, 255, 0.6), 0 0 30px rgba(0, 255, 255, 0.4); }
    100% { text-shadow: 0 0 10px rgba(255, 0, 255, 0.8), 0 0 20px rgba(255, 0, 255, 0.6), 0 0 30px rgba(255, 0, 255, 0.4); }
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  @keyframes fadeIn {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Paragraph Styles */
  .FirstPara,
  .SecondPara {
    color: #00ffff;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1em;
    text-shadow: 0 0 8px rgba(0, 255, 255, 0.7), 0 0 15px rgba(0, 255, 255, 0.5);
    animation: fadeIn 1s ease-in forwards;
  }

  /* Content Container Styles */
  .content-div {
    border: 1px solid red;
    padding: 15px;
    margin-bottom: 20px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 5px;
  }

  /* Media Elements */
  img {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
  }

  /* Responsive Design */
  @media (max-width: 600px) {
    .MainHeader { font-size: 1.8em; }
    h3.MainHeader { font-size: 1em; }
    img { width: 100%; } 
    .content-div { padding: 10px; }
  }

  /* 低頭族 Dash game */
  .pz-canvas {
    display: block; width: 100%; max-width: 420px; height: auto;
    aspect-ratio: 360 / 540; margin: 10px auto 8px;
    border: 2px solid #ff2a2a; border-radius: 8px; background: #07041a;
    box-shadow: 0 0 18px rgba(255, 0, 60, 0.45);
    touch-action: manipulation; cursor: pointer; outline: none;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  .pz-canvas:focus-visible { box-shadow: 0 0 0 3px #00ffff, 0 0 18px rgba(255, 0, 60, 0.45); }
  .pz-hint { margin: 0; text-align: center; color: #9aa; font-size: 0.85em; }

  /* Dimsum Daily headlines widget */
  .news-widget {
    background: rgba(0, 0, 0, 0.78);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  .news-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-bottom: 10px;
  }
  .news-title {
    margin: 0; color: #ff4040; font-family: 'Press Start 2P', cursive;
    font-size: 0.8em; line-height: 1.6;
    text-shadow: 0 0 6px rgba(255, 64, 64, 0.8);
  }
  .live-dot {
    display: inline-block; width: 8px; height: 8px; margin-right: 8px;
    border-radius: 50%; background: #ff2a2a; vertical-align: middle;
    box-shadow: 0 0 8px #ff2a2a; animation: blink 1.4s infinite;
  }
  @keyframes blink { 50% { opacity: 0.25; } }
  .news-updated { color: #8fdfdf; font-family: 'Orbitron', sans-serif; font-size: 0.7em; }
  .news-list { list-style: none; margin: 0; padding: 0; }
  .news-list li { border-top: 1px solid rgba(255, 0, 0, 0.25); }
  .news-list li:first-child { border-top: none; }
  .news-list a {
    display: block; padding: 10px 6px; color: #fff; text-decoration: none;
    border-radius: 4px; transition: background 0.2s;
  }
  .news-list a:hover, .news-list a:focus-visible {
    background: rgba(0, 255, 255, 0.08); outline: none;
  }
  .news-list .headline { display: block; font-weight: bold; line-height: 1.35; }
  .news-list a:hover .headline { color: #00ffff; text-shadow: 0 0 6px rgba(0, 255, 255, 0.6); }
  .news-list .meta { display: block; margin-top: 3px; color: #9aa; font-size: 0.8em; }
  .news-more {
    display: block; margin-top: 10px; text-align: center; color: #00ffff;
    font-family: 'Orbitron', sans-serif; font-size: 0.85em; text-decoration: none;
  }
  .news-more:hover { text-decoration: underline; }
  .news-skeleton {
    height: 14px; margin: 14px 6px; border-radius: 3px;
    background: linear-gradient(90deg, #222 25%, #333 50%, #222 75%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite linear;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .news-empty { color: #ccc; text-align: center; padding: 10px; }
  @media (prefers-reduced-motion: reduce) {
    .live-dot, .news-skeleton { animation: none; }
  }
</style>
</head>
<body>
  <canvas id="backgroundCanvas"></canvas>

  <h1 title="You are hovering over my header" class="MainHeader">
    The Insiders Guide to Hong Kong
  </h1>

  <h3 title="You are hovering over my header" class="MainHeader">
    Hong Kong Hacks, Adventures, and Lifestyle Tips
  </h3>

  <section class="content-div news-widget" aria-labelledby="newsTitle">
    <div class="news-head">
      <h2 class="news-title" id="newsTitle"><span class="live-dot"></span>HK Headlines</h2>
      <span class="news-updated" id="newsUpdated"></span>
    </div>
    <ul class="news-list" id="newsList" aria-live="polite">
      <li class="news-skeleton"></li><li class="news-skeleton"></li><li class="news-skeleton"></li>
    </ul>
    <a class="news-more" href="https://www.dimsumdaily.hk/" target="_blank" rel="noopener">More on Dimsum Daily →</a>
  </section>

  <section class="content-div pz-section" aria-labelledby="pzTitle">
    <p class="FirstPara" id="pzTitle">Can you survive a walk through Hong Kong?</p>
    <canvas id="pzCanvas" class="pz-canvas" width="360" height="540" tabindex="0"
      aria-label="低頭族 Dash game. Use the left and right arrow keys, or tap the left or right side, to dodge people looking at their phones."></canvas>
    <p class="pz-hint">← → or A / D to dodge · On mobile, tap the left or right side</p>
  </section>

  <div class="content-div">
    <img src="https://github.com/merulzthecryptoverse/merulzthecryptoverse.github.io/blob/Images/465237508_122101090316596174_6996163836068378838_n%20-%20Copy.jpg?raw=true" alt="Surfs up in HongKong">
  </div>

  <script>
    // Dimsum Daily headlines widget (data refreshed by a GitHub Action)
    (function () {
      const list = document.getElementById('newsList');
      const updatedEl = document.getElementById('newsUpdated');
      const SHOW = 6;

      function timeAgo(iso) {
        const t = Date.parse(iso);
        if (isNaN(t)) return '';
        const mins = Math.max(0, Math.round((Date.now() - t) / 60000));
        if (mins < 60) return mins <= 1 ? 'just now' : mins + ' min ago';
        const hrs = Math.round(mins / 60);
        if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
        const days = Math.round(hrs / 24);
        return days + (days === 1 ? ' day ago' : ' days ago');
      }

      function render(data) {
        const items = (data.items || []).slice(0, SHOW);
        list.innerHTML = '';
        if (!items.length) throw new Error('no items');
        for (const item of items) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = item.link;
          a.target = '_blank';
          a.rel = 'noopener';
          const title = document.createElement('span');
          title.className = 'headline';
          title.textContent = item.title;
          a.appendChild(title);
          const meta = item.date ? timeAgo(item.date) : '';
          if (meta) {
            const m = document.createElement('span');
            m.className = 'meta';
            m.textContent = meta;
            a.appendChild(m);
          }
          li.appendChild(a);
          list.appendChild(li);
        }
        if (data.updated) updatedEl.textContent = 'Updated ' + timeAgo(data.updated);
      }

      function showEmpty() {
        list.innerHTML = '<li class="news-empty">Headlines are on their way. Check back soon.</li>';
      }

      fetch('headlines.json?v=' + Date.now())
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(render)
        .catch(showEmpty);
    })();

    // Mystify-inspired screensaver animation
    const backgroundCanvas = document.getElementById('backgroundCanvas');
    const ctx = backgroundCanvas.getContext('2d');

    function resizeCanvas() {
      backgroundCanvas.width = window.innerWidth;
      backgroundCanvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Line {
      constructor() {
        this.x1 = Math.random() * backgroundCanvas.width;
        this.y1 = Math.random() * backgroundCanvas.height;
        this.x2 = this.x1 + (Math.random() * 100 - 50);
        this.y2 = this.y1 + (Math.random() * 100 - 50);
        this.vx1 = (Math.random() * 4 - 2);
        this.vy1 = (Math.random() * 4 - 2);
        this.vx2 = (Math.random() * 4 - 2);
        this.vy2 = (Math.random() * 4 - 2);
        this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
      }

      update() {
        this.x1 += this.vx1;
        this.y1 += this.vy1;
        this.x2 += this.vx2;
        this.y2 += this.vy2;

        if (this.x1 < 0 || this.x1 > backgroundCanvas.width) this.vx1 *= -1;
        if (this.y1 < 0 || this.y1 > backgroundCanvas.height) this.vy1 *= -1;
        if (this.x2 < 0 || this.x2 > backgroundCanvas.width) this.vx2 *= -1;
        if (this.y2 < 0 || this.y2 > backgroundCanvas.height) this.vy2 *= -1;
      }

      draw() {
        ctx.beginPath();
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2;
        ctx.moveTo(this.x1, this.y1);
        ctx.lineTo(this.x2, this.y2);
        ctx.stroke();
      }
    }

    const lines = Array.from({ length: 20 }, () => new Line());

    function animateBackground() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, backgroundCanvas.width, backgroundCanvas.height);

      lines.forEach(line => {
        line.update();
        line.draw();
      });

      requestAnimationFrame(animateBackground);
    }
    animateBackground();

  </script>
  <script src="games/phone-zombies.js" defer></script>
</body>
</html>
